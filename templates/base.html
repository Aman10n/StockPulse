<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart Stock Monitoring Platform — Real-time portfolio tracking, smart alerts, and analytics.">
    <title>{% block title %}StockPulse{% endblock %} | Smart Stock Monitor</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-graph-up-arrow brand-icon"></i>
            <span class="brand-text">StockPulse</span>
        </div>

        <ul class="sidebar-nav">
            <li>
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}" id="nav-dashboard">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/portfolio" class="nav-link {% if request.path == '/portfolio' %}active{% endif %}" id="nav-portfolio">
                    <i class="bi bi-briefcase"></i>
                    <span>Portfolio</span>
                </a>
            </li>
            <li>
                <a href="/alerts" class="nav-link {% if request.path == '/alerts' %}active{% endif %}" id="nav-alerts">
                    <i class="bi bi-bell"></i>
                    <span>Alerts</span>
                </a>
            </li>
            <li>
                <a href="/analytics" class="nav-link {% if request.path == '/analytics' %}active{% endif %}" id="nav-analytics">
                    <i class="bi bi-bar-chart-line"></i>
                    <span>Analytics</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div id="market-status-sidebar" class="market-badge">
                <span class="status-dot"></span>
                <span class="status-text">Loading…</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="top-bar">
            <button class="btn btn-link sidebar-toggle d-md-none" onclick="document.getElementById('sidebar').classList.toggle('open')">
                <i class="bi bi-list fs-4"></i>
            </button>

            <div class="top-bar-title">
                <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
            </div>

            <div class="top-bar-right">
                <div id="market-status-top" class="market-badge-top">
                    <span class="status-dot"></span>
                    <span class="status-text">Loading…</span>
                </div>
                <div class="clock" id="live-clock"></div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Toast container for notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <!-- Audio for alerts -->
    <audio id="alert-sound" preload="auto">
        <source src="/static/audio/alert.mp3" type="audio/mpeg">
    </audio>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared JS -->
    <script src="/static/js/main.js"></script>

    <!-- Page-specific JS -->
    {% block scripts %}{% endblock %}
</body>
</html>
